name: Sync from server

# 本番サーバ（FTP）の中身を「正」として取り込み、
# リポジトリとの差分があれば Pull Request を作成します。
#
# main を直接書き換えることはありません。必ず PR の差分を確認してから
# マージしてください。マージすると deploy.yml が走り、
# 同じ内容がサーバへ返るだけなので実質無害です。
#
# 実行方法: Actions タブ → "Sync from server" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: server-sync
  cancel-in-progress: false

env:
  # deploy.yml の server-dir と同じ場所を指すこと
  REMOTE_DIR: /pure-growth.co.jp/wp-content/themes/pure-growth/

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download theme from server
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/server"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --parallel=4 --exclude-glob .git/ \"$REMOTE_DIR\" \"$RUNNER_TEMP/server\";
          "
          echo "ダウンロードしたファイル数: $(find "$RUNNER_TEMP/server" -type f | wc -l)"

      # サーバの内容でワークツリーを置き換える。
      # .git と .github（CI設定そのもの）はサーバ側に無いので除外する。
      - name: Apply server state to working tree
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$RUNNER_TEMP/server/" ./

      - name: Show diff summary
        run: git --no-pager diff --stat | tail -40

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/server-sync
          delete-branch: true
          title: "chore: 本番サーバの内容を取り込み"
          commit-message: |
            chore: 本番サーバの内容を取り込み

            FTP 上の wp-content/themes/pure-growth/ をそのまま反映。
            サーバを正とした同期のため、リポジトリ側にしか無かった変更は
            この差分で削除として現れる。マージ前に必ず確認すること。
          body: |
            本番サーバ（FTP）の内容をそのまま取り込んだ差分です。

            - **追加/変更**: サーバにあってリポジトリに無い（または内容が違う）ファイル
            - **削除**: リポジトリにあってサーバに無いファイル

            サーバを正とする同期なので、リポジトリ側にしか無かった作業中の変更が
            あればここで消えます。**マージ前に必ず差分を確認してください。**

            `.github/` は CI 設定のためサーバには存在せず、同期対象外です。
